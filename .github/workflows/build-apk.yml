name: Build RingBack APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RingBack-Android-V3.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract RingBack V3
        run: |
          unzip -q RingBack-Android-V3.zip

      - name: Build APK
        working-directory: RingBack
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RingBack-debug-apk
          path: RingBack/app/build/outputs/apk/debug/app-debug.apk
